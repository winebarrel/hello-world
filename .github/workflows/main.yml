on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write
  
jobs:
  my-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: winebarrel/lastcmt@v0.6.2
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr view ${{ github.event.number }} --json mergeable -q '.mergeable'
          echo test | lastcmt ${{ github.event.number }} 
